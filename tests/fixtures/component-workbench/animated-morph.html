<!doctype html><html><head><style>
html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:transparent}.morph{width:180px;height:82px;border:0;border-radius:12px;background:#253436;color:#fff;transition:width .6s,border-radius .6s,transform .6s}.morph.selected{width:82px;border-radius:50%;transform:rotate(360deg)}
</style></head><body><button class="morph">SELECT</button><script>
const morph=document.querySelector('.morph');morph.addEventListener('pointerup',()=>morph.classList.toggle('selected'));
</script></body></html>
