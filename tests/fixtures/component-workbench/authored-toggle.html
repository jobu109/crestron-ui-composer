<!doctype html><html><head><style>
html,body{margin:0;width:100%;height:100%;background:transparent}.toggle{width:190px;height:82px;padding:8px;border:0;border-radius:14px;background:#303838;transition:.35s}.knob{width:66px;height:66px;border-radius:10px;background:#eee;transition:transform .35s}.toggle.selected{background:#04aa8e}.toggle.selected .knob{transform:translateX(108px)}
</style></head><body><button class="toggle"><span class="knob"></span></button><script>
const toggle=document.querySelector('.toggle');toggle.addEventListener('pointerup',()=>toggle.classList.toggle('selected'));
</script></body></html>
