<!doctype html><html><head><style>
html,body{margin:0;width:100%;height:100%;background:transparent}.toggle-control{position:absolute;opacity:0;pointer-events:none}.toggle{display:grid;grid-template-columns:1fr auto;align-items:center;width:190px;height:82px;padding:8px;border:0;border-radius:14px;background:#303838;transition:.35s}.track{position:relative;width:108px;height:54px;border-radius:12px;background:#1e292a}.knob{position:absolute;width:46px;height:46px;left:4px;top:4px;border-radius:10px;background:#eee;transition:transform .35s}.label{color:#fff;font:700 16px Segoe UI}.toggle-control:checked + .toggle{background:#04aa8e}.toggle-control:checked + .toggle .knob{transform:translateX(54px)}
</style></head><body><input id="fixture-toggle" class="toggle-control" type="checkbox"><label class="toggle" for="fixture-toggle"><span class="label">POWER</span><span class="track"><span class="knob"></span></span></label><script>
const control=document.querySelector('.toggle-control'),toggle=document.querySelector('.toggle');toggle.addEventListener('pointerup',()=>{control.checked=!control.checked;control.dispatchEvent(new Event('change',{bubbles:true}))});
</script></body></html>
